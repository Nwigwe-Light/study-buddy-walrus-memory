<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Buddy</title>
<style>
  :root { --ink:#16222C; --paper:#EAEFF3; --panel:#fff; --green:#1F6F5C; --mark:#F4D35E; --line:#cfd8df; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { height:100%; display:grid; grid-template-columns: 1fr 320px; gap:16px; padding:16px; max-width:1100px; margin:0 auto; }
  .chat, .notebook { background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; min-height:0; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  header h1 { font-family: Charter, Georgia, serif; font-size:1.25rem; margin:0; }
  header a { color:var(--green); font-size:.9rem; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:10px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user { align-self:flex-end; background:var(--green); color:#fff; }
  .msg.bot { align-self:flex-start; background:#F1F4F7; border:1px solid var(--line); }
  .used { align-self:flex-start; max-width:85%; font-size:.85rem; line-height:1.45; padding:8px 12px;
          background:var(--mark); border-radius:6px; }
  .used b { display:block; margin-bottom:2px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input { flex:1; padding:12px; font-size:1rem; border:1px solid #9fb0bd; border-radius:6px; min-width:0; }
  button { padding:0 18px; font-size:1rem; font-weight:600; color:#fff; background:var(--green); border:0; border-radius:6px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline:3px solid var(--green); outline-offset:2px; }
  .notebook h2 { font-family: Charter, Georgia, serif; font-size:1.1rem; margin:0; }
  #notes { flex:1; overflow-y:auto; padding:12px 16px; margin:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
  #notes li { font-size:.9rem; line-height:1.4; padding:8px 10px; background:#FBF3CC; border-left:4px solid var(--mark); border-radius:4px; }
  .refresh { margin:12px; padding:10px; background:#fff; color:var(--green); border:1px solid var(--green); }
  .hint { color:#4a5b68; font-size:.85rem; padding:0 16px 12px; line-height:1.4; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr 240px; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="chat" aria-label="Chat">
    <header>
      <h1>Hi {{ name }}, what are we studying?</h1>
      <a href="/logout/">Switch student</a>
    </header>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input id="msg" autocomplete="off" placeholder="Tell me about your courses, exams or what you find hard" required>
      <button id="send" type="submit">Send</button>
    </form>
  </section>
  <aside class="notebook" aria-label="What I remember">
    <header><h2>What I remember about you</h2></header>
    <p class="hint">New memories can take up to a minute to show up after you say something.</p>
    <ul id="notes"></ul>
    <button class="refresh" id="refresh" type="button">Refresh memories</button>
  </aside>
</div>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("msg");
  const send = document.getElementById("send");
  const notes = document.getElementById("notes");
  const history = [];

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function addUsed(items) {
    if (!items.length) return;
    const el = document.createElement("div");
    el.className = "used";
    const b = document.createElement("b");
    b.textContent = "Recalled from earlier chats:";
    el.appendChild(b);
    items.forEach(t => { const d = document.createElement("div"); d.textContent = "• " + t; el.appendChild(d); });
    log.appendChild(el);
  }

  async function loadNotes() {
    notes.innerHTML = "";
    const li = document.createElement("li");
    li.textContent = "Loading…";
    notes.appendChild(li);
    try {
      const r = await fetch("/api/memories/");
      const data = await r.json();
      notes.innerHTML = "";
      const list = data.memories || [];
      if (!list.length) {
        const e = document.createElement("li");
        e.textContent = "Nothing yet. Tell me about your courses and exams.";
        notes.appendChild(e);
      }
      list.forEach(t => { const e = document.createElement("li"); e.textContent = t; notes.appendChild(e); });
    } catch (e) {
      notes.innerHTML = "<li>Could not load memories. Try Refresh.</li>";
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    add("user", text);
    send.disabled = true;
    const waiting = add("bot", "Thinking…");
    try {
      const r = await fetch("/api/chat/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history })
      });
      const data = await r.json();
      waiting.remove();
      if (data.error) { add("bot", "Something went wrong: " + data.error); }
      else {
        addUsed(data.recalled || []);
        add("bot", data.reply);
        history.push({ role: "user", text }, { role: "bot", text: data.reply });
      }
    } catch (err) {
      waiting.remove();
      add("bot", "Could not reach the server. Check your connection and try again.");
    }
    send.disabled = false;
    input.focus();
  });

  document.getElementById("refresh").addEventListener("click", loadNotes);
  loadNotes();
</script>
</body>
</html>
